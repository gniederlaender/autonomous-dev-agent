project:
  admin_only: true
  name: "Review Cruncher"
  path: "/opt/Review-Cruncher"
  repo: "gniederlaender/Review-Cruncher"
  branch: "main"
  description: "AI-powered product review aggregator and recommendation system"

health_checks:
  - type: "http"
    url: "https://www.reviewcruncher.com/"
    expected_status: 200
    timeout: 10

  - type: "api"
    url: "https://www.reviewcruncher.com/api/recent-reviews"
    expected_json: true
    timeout: 10

  - type: "pm2"
    process_name: "review_cruncher_backend"
    expected_status: "online"

feedback_sources:
  - type: "file"
    path: "/opt/Review-Cruncher/feedback.json"

  # Note: Enable log monitoring if needed
  # - type: "logs"
  #   path: "/opt/Review-Cruncher/logs/error.log"
  #   max_lines: 100

  - type: "todo"
    path: "/opt/Review-Cruncher/TODO.md"

safety_rules:
  autonomous_execution:
    - documentation_updates
    - test_additions
    - bug_fixes
    - new_features
    - refactoring
    - schema_changes
    - dependency_updates

  always_escalate:
    - security_vulnerabilities
    - breaking_api_changes
    - deployment_config_changes
    - infrastructure_changes
    - api_key_changes

execution:
  git_commit: true
  git_push: true
  git_user_name: "Autonomous Dev Agent"
  git_user_email: "agent@smartprototypes.net"

communication:
  report_format: "markdown"
  report_path: "/opt/autonomous-dev-agent/reports"

  email:
    enabled: true
    to: "gabor.niederlaender@gmx.at"
    from: "gabor.niederlaender@gmx.at"
    subject_prefix: "[Review Cruncher Agent]"
    smtp_host: "mail.gmx.net"
    smtp_port: 587
    use_tls: true

escalation:
  method: "email"
  to: "gabor.niederlaender@gmx.at"

scheduling:
  enabled: true
  cron: "0 6 * * *"  # Daily at 6:00 AM
  timezone: "Europe/Vienna"

risk_tolerance: "medium"  # low, medium, high
