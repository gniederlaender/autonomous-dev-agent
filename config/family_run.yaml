project:
  name: "Family Run Tracker"
  path: "/opt/family_run"
  repo: "gniederlaender/family_run"
  branch: "main"

health_checks:
  - type: "http"
    url: "https://smartprototypes.net/family_run/"
    expected_status: 200
    timeout: 10

  - type: "api"
    url: "https://smartprototypes.net/family_run/api/data"
    expected_json: true
    timeout: 10

  - type: "pm2"
    process_name: "family-run"
    expected_status: "online"

feedback_sources:
  - type: "file"
    path: "/opt/family_run/feedback.json"

  # Disabled: Log monitoring creates repetitive tasks for old log entries
  # - type: "logs"
  #   path: "/opt/family_run/logs/error.log"
  #   max_lines: 100

safety_rules:
  autonomous_execution:
    - documentation_updates
    - test_additions
    - bug_fixes
    - new_features
    - refactoring
    - schema_changes
    - dependency_updates

  always_escalate:
    - security_vulnerabilities
    - breaking_api_changes
    - deployment_config_changes
    - infrastructure_changes

execution:
  git_commit: true
  git_push: true
  git_user_name: "Autonomous Dev Agent"
  git_user_email: "agent@smartprototypes.net"

communication:
  report_format: "markdown"
  report_path: "/opt/autonomous-dev-agent/reports"

  email:
    enabled: true
    to: "gabor.niederlaender@gmx.at"
    from: "gabor.niederlaender@gmx.at"  # Must be your GMX email address
    subject_prefix: "[Family Run Agent]"
    smtp_host: "mail.gmx.net"
    smtp_port: 587
    use_tls: true

escalation:
  method: "email"
  to: "gabor.niederlaender@gmx.at"

risk_tolerance: "medium"  # low, medium, high
