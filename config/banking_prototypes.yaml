project:
  name: "Banking Prototypes"
  path: "/var/www/smartprototypes.net/public_html/UI_Prototypes/Banking_Prototypes"
  repo: "gniederlaender/Banking_Prototypes"
  branch: "main"

health_checks:
  - type: "http"
    url: "https://smartprototypes.net/UI_Prototypes/Banking_Prototypes/"
    expected_status: 200
    timeout: 10

  - type: "http"
    url: "https://smartprototypes.net/UI_Prototypes/Banking_Prototypes/index.html"
    expected_status: 200
    timeout: 10

feedback_sources:
  - type: "file"
    path: "/var/www/smartprototypes.net/public_html/UI_Prototypes/Banking_Prototypes/feedback.json"

safety_rules:
  autonomous_execution:
    - documentation_updates
    - new_features
    - bug_fixes
    - ui_improvements
    - prototype_creation
    - style_updates

  always_escalate:
    - security_vulnerabilities
    - breaking_changes
    - infrastructure_changes

execution:
  git_commit: true
  git_push: true
  git_user_name: "Banking Prototypes Agent"
  git_user_email: "agent@smartprototypes.net"

communication:
  report_format: "markdown"
  report_path: "/opt/autonomous-dev-agent/reports/banking_prototypes"

  email:
    enabled: true
    to: "gabor.niederlaender@gmx.at"
    from: "gabor.niederlaender@gmx.at"
    subject_prefix: "[Banking Prototypes Agent]"
    smtp_host: "mail.gmx.net"
    smtp_port: 587
    use_tls: true

escalation:
  method: "email"
  to: "gabor.niederlaender@gmx.at"

risk_tolerance: "medium"  # low, medium, high
